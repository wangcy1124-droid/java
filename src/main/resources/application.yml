server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:10}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: 5s
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 3s
    template:
      mandatory: true
    listener:
      simple:
        prefetch: ${RABBITMQ_PREFETCH:10}
        concurrency: ${RABBITMQ_CONCURRENCY:2}
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  type-aliases-package: com.hmdp.entity
logging:
  level:
    com.hmdp: ${APP_LOG_LEVEL:info}
hmdp:
  social:
    cache-seconds: ${SOCIAL_CACHE_SECONDS:300}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
  shop-cache:
    maximum-size: ${SHOP_CACHE_MAXIMUM_SIZE:10000}
    l1-seconds: ${SHOP_CACHE_L1_SECONDS:5}
    ttl-seconds: ${SHOP_CACHE_TTL_SECONDS:1800}
    jitter-seconds: ${SHOP_CACHE_JITTER_SECONDS:300}
    null-seconds: ${SHOP_CACHE_NULL_SECONDS:120}
    hot-ids: ${SHOP_CACHE_HOT_IDS:1}
    hot-logical-seconds: ${SHOP_CACHE_HOT_LOGICAL_SECONDS:60}
    hot-physical-seconds: ${SHOP_CACHE_HOT_PHYSICAL_SECONDS:300}
    lock-wait-millis: ${SHOP_CACHE_LOCK_WAIT_MILLIS:2000}
  order:
    payment-timeout-seconds: ${ORDER_PAYMENT_TIMEOUT_SECONDS:900}
    close-enabled: ${ORDER_CLOSE_ENABLED:true}
    close-delay-ms: ${ORDER_CLOSE_DELAY_MS:10000}
    confirm-timeout-ms: ${ORDER_CONFIRM_TIMEOUT_MS:3000}
    recovery-age-ms: ${ORDER_RECOVERY_AGE_MS:300000}
    recovery-delay-ms: ${ORDER_RECOVERY_DELAY_MS:10000}
  upload-dir: ${UPLOAD_DIR:./data/imgs}
